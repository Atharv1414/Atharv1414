name: update profile

on:
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/**", "tests/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency: update-profile

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q pytest && pytest -q
      - run: python scripts/update_profile.py
      - name: Commit only if something changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Update latest projects"
          git pull -q --rebase
          git push -q
